name: Fonctionnalité
description: Nouvelle fonctionnalité ou évolution, rattachée au cahier des charges
title: "[Domaine] Verbe + objet"
labels: ["type: feature"]
body:
  - type: input
    id: ref
    attributes:
      label: Référence cahier des charges
      description: Identifiant(s) dans docs/exigences.md
      placeholder: F-10, NFR-01
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Pourquoi cette fonctionnalité, pour quel persona
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objectif
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description détaillée
  - type: textarea
    id: tasks
    attributes:
      label: Tâches
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Format Given / When / Then si possible
    validations:
      required: true
  - type: textarea
    id: tech
    attributes:
      label: Spécifications techniques
  - type: textarea
    id: files
    attributes:
      label: Fichiers et dossiers concernés
  - type: textarea
    id: deps
    attributes:
      label: Dépendances
      placeholder: Bloquée par #…
  - type: input
    id: branch
    attributes:
      label: Branche
      placeholder: feature/<n°>-<slug>
