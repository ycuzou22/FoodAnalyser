name: repo-ci

# Vérifications transverses : formatage des fichiers racine, ESLint partagé,
# tests du vérificateur de messages de commit, validation du Compose.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint racine et scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier + ESLint
        run: pnpm lint
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Tests du vérificateur de commits
        run: python -m unittest discover -s infra/scripts -v
      - name: Validation du Docker Compose
        run: docker compose -f infra/docker/compose.dev.yml --env-file infra/docker/.env.example config -q
      - name: Syntaxe des scripts shell
        run: for f in infra/scripts/*.sh; do bash -n "$f"; done
