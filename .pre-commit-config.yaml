# Hooks Git du projet. Installation (une fois) : make install  (ou : pre-commit install --install-hooks)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: ruff (api)
        files: ^services/api/
        args: [--fix, --config=services/api/pyproject.toml]
      - id: ruff-format
        name: ruff format (api)
        files: ^services/api/
        args: [--config=services/api/pyproject.toml]
      - id: ruff
        name: ruff (ai)
        files: ^services/ai/
        args: [--fix, --config=services/ai/pyproject.toml]
      - id: ruff-format
        name: ruff format (ai)
        files: ^services/ai/
        args: [--config=services/ai/pyproject.toml]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, css]
        exclude: ^(services/|pnpm-lock\.yaml)
      - id: commit-msg-format
        name: format du message de commit
        entry: python3 infra/scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
